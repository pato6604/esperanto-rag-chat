# Esperanto Backend — Cloud Build config
# Uso: gcloud builds submit --config=backend/cloudbuild.yaml backend/
#
# Variables de entorno requeridas (configurar en Cloud Build Trigger o --substitutions):
#   _QDRANT_URL, _QDRANT_API_KEY, _GOOGLE_API_KEY, _AUTH_SECRET, _CORS_ORIGINS

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/esperanto/backend:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/esperanto/backend:latest'
      - '.'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/esperanto/backend'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'esperanto-backend'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/esperanto/backend:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--concurrency=10'
      - '--timeout=120'
      - '--set-env-vars=ENV=production'
      - '--set-env-vars=QDRANT_MODE=cloud'
      - '--set-env-vars=GEMINI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai'
      - '--update-secrets=GOOGLE_API_KEY=google-api-key:latest'
      - '--update-secrets=QDRANT_API_KEY=qdrant-api-key:latest'
      - '--update-secrets=AUTH_SECRET=auth-secret:latest'
      - '--set-env-vars=QDRANT_URL=${_QDRANT_URL}'
      - '--set-env-vars=CORS_ORIGINS=${_CORS_ORIGINS}'
      - '--allow-unauthenticated'

substitutions:
  _REGION: sa-east1
  _QDRANT_URL: 'https://1e2e7f4f-25d3-4a42-9df4-21ff613a7edf.sa-east-1-0.aws.cloud.qdrant.io'
  _CORS_ORIGINS: 'https://esperanto-rag.vercel.app'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
